name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# 同一个 tag 的发布不并行，也不互相取消：上传到 Release 的文件只能来自一次完整构建。
concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布 tag 必须与 pubspec.yaml 的版本一致：否则“关于”页显示的版本与 Release 对
  # 不上，versionCode 没递增时用户还无法覆盖升级。tag 可省略构建号（v0.6.0 对应
  # 0.6.0+17）。单独成 job，版本不符时立即失败，不必等门禁跑完。
  check-version:
    name: Check tag matches pubspec version
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare release tag with pubspec.yaml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d "\"'[:space:]")"
          if [[ -z "$version" ]]; then
            echo "::error file=pubspec.yaml::Cannot read the version from pubspec.yaml"
            exit 1
          fi
          if [[ "$TAG" != "v${version}" && "$TAG" != "v${version%%+*}" ]]; then
            echo "::error file=pubspec.yaml::Release tag $TAG does not match pubspec.yaml version $version (expected v${version%%+*} or v${version})"
            exit 1
          fi
          echo "Release $TAG builds version $version"

  # 与 PR / main 相同的门禁（格式、analyze、生成代码、测试、工作流 lint）。签名 APK
  # 由下面的 job 自己构建，所以跳过 CI 里那次一次性签名的构建。
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      skip-android-build: true
    permissions:
      contents: read

  build-release-apk:
    name: Build signed split release APKs
    needs: [check-version, ci]
    # check-version 只在 release 事件运行；手动触发时它被跳过，不应连带跳过构建。
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success' &&
      (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') }}
    # Pin the image instead of `ubuntu-latest`: the label migrates to Ubuntu 26 on
    # 2026-10-19 while Flutter is pinned in .github/actions/setup-flutter, so an unplanned
    # image jump could break signed release builds mid-window. Move deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # 只有这个 job 需要写权限（上传 Release 附件）。
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Flutter 版本与 CI 同源，定义在 .github/actions/setup-flutter。
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
        with:
          java: 'true'

      - name: Restore Android release signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing secret ANDROID_KEY_PASSWORD"; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo "::error::Missing secret ANDROID_STORE_PASSWORD"; exit 1; }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=upload-keystore.jks\n'
          } > android/key.properties

      - name: Write Android runtime secrets
        env:
          AMAP_WEB_API_KEY: ${{ secrets.AMAP_WEB_API_KEY }}
          QWEATHER_CREDENTIAL_ID: ${{ secrets.QWEATHER_CREDENTIAL_ID }}
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
        run: |
          set -euo pipefail

          fail_runtime_secret() {
            local message="$1"
            echo "Runtime secret validation failed: $message"
            echo "::error::$message"
            exit 1
          }

          require_single_line_secret() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              fail_runtime_secret "Missing secret $name"
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              fail_runtime_secret "Secret $name must contain exactly one line"
            fi
            if [[ "$value" =~ ^[[:space:]] || "$value" =~ [[:space:]]$ ]]; then
              fail_runtime_secret "Secret $name must not contain leading or trailing whitespace"
            fi
            return 0
          }

          printf 'Runtime secret lengths: AMAP=%d QWEATHER_CREDENTIAL=%d QWEATHER_KEY=%d QWEATHER_HOST=%d\n' \
            "${#AMAP_WEB_API_KEY}" \
            "${#QWEATHER_CREDENTIAL_ID}" \
            "${#QWEATHER_API_KEY}" \
            "${#QWEATHER_API_HOST}"

          require_single_line_secret AMAP_WEB_API_KEY "$AMAP_WEB_API_KEY"
          require_single_line_secret QWEATHER_CREDENTIAL_ID "$QWEATHER_CREDENTIAL_ID"
          require_single_line_secret QWEATHER_API_KEY "$QWEATHER_API_KEY"
          require_single_line_secret QWEATHER_API_HOST "$QWEATHER_API_HOST"

          if [[ ! "$AMAP_WEB_API_KEY" =~ ^[A-Za-z0-9]{32}$ ]]; then
            fail_runtime_secret "Secret AMAP_WEB_API_KEY must be a 32-character alphanumeric key"
          fi

          touch android/local.properties
          {
            printf '\n'
            printf 'amap.web.api.key=%s\n' "$AMAP_WEB_API_KEY"
            printf 'qweather.credential_id=%s\n' "$QWEATHER_CREDENTIAL_ID"
            printf 'qweather.api_key=%s\n' "$QWEATHER_API_KEY"
            printf 'qweather.api_host=%s\n' "$QWEATHER_API_HOST"
          } >> android/local.properties

          grep -Eq '^amap\.web\.api\.key=.+$' android/local.properties ||
            fail_runtime_secret 'Failed to write amap.web.api.key'
          grep -Eq '^qweather\.credential_id=.+$' android/local.properties ||
            fail_runtime_secret 'Failed to write qweather.credential_id'
          grep -Eq '^qweather\.api_key=.+$' android/local.properties ||
            fail_runtime_secret 'Failed to write qweather.api_key'
          grep -Eq '^qweather\.api_host=.+$' android/local.properties ||
            fail_runtime_secret 'Failed to write qweather.api_host'

      # 网盘备份的应用密钥经 --dart-define-from-file 注入（见 docs/cloud_backup.md）。
      # 每个网盘都是可选的：未配置的只告警，安装包里不显示该网盘；配置了但格式
      # 不对、或成对的值只配了一半时构建失败，避免发布授权必然失败的包。
      - name: Write cloud backup app keys
        env:
          JOTSY_GOOGLE_CLIENT_ID: ${{ secrets.JOTSY_GOOGLE_CLIENT_ID }}
          JOTSY_GOOGLE_CLIENT_SECRET: ${{ secrets.JOTSY_GOOGLE_CLIENT_SECRET }}
          JOTSY_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JOTSY_GOOGLE_WEB_CLIENT_ID }}
          JOTSY_DROPBOX_APP_KEY: ${{ secrets.JOTSY_DROPBOX_APP_KEY }}
          JOTSY_MICROSOFT_CLIENT_ID: ${{ secrets.JOTSY_MICROSOFT_CLIENT_ID }}
          JOTSY_MICROSOFT_TENANT: ${{ vars.JOTSY_MICROSOFT_TENANT }}
          JOTSY_BAIDU_APP_KEY: ${{ secrets.JOTSY_BAIDU_APP_KEY }}
          JOTSY_BAIDU_SECRET_KEY: ${{ secrets.JOTSY_BAIDU_SECRET_KEY }}
          JOTSY_BAIDU_APP_DIR: ${{ vars.JOTSY_BAIDU_APP_DIR }}
          JOTSY_ALIYUN_CLIENT_ID: ${{ secrets.JOTSY_ALIYUN_CLIENT_ID }}
          JOTSY_ALIYUN_CLIENT_SECRET: ${{ secrets.JOTSY_ALIYUN_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          fail_key() {
            echo "Cloud backup key validation failed: $1"
            echo "::error::$1"
            exit 1
          }

          # 已配置的值必须是单行、无首尾空白，且符合 [pattern]。
          check_key() {
            local name="$1" pattern="$2" value="${!1:-}"
            [[ -z "$value" ]] && return 0
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              fail_key "Secret $name must contain exactly one line"
            fi
            if [[ "$value" =~ ^[[:space:]] || "$value" =~ [[:space:]]$ ]]; then
              fail_key "Secret $name must not contain leading or trailing whitespace"
            fi
            [[ "$value" =~ $pattern ]] || fail_key "Secret $name has an unexpected format"
          }

          # 成对使用的值要么都配，要么都不配。
          check_pair() {
            if [[ -n "${!1:-}" && -z "${!2:-}" ]] || [[ -z "${!1:-}" && -n "${!2:-}" ]]; then
              fail_key "Secrets $1 and $2 must be set together"
            fi
          }

          google_client='^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'
          check_key JOTSY_GOOGLE_CLIENT_ID "$google_client"
          check_key JOTSY_GOOGLE_CLIENT_SECRET '^GOCSPX-[A-Za-z0-9_-]+$'
          check_key JOTSY_GOOGLE_WEB_CLIENT_ID "$google_client"
          check_key JOTSY_DROPBOX_APP_KEY '^[a-z0-9]+$'
          check_key JOTSY_MICROSOFT_CLIENT_ID '^[0-9a-fA-F-]{36}$'
          check_key JOTSY_MICROSOFT_TENANT '^[A-Za-z0-9.-]+$'
          check_key JOTSY_BAIDU_APP_KEY '^[A-Za-z0-9]+$'
          check_key JOTSY_BAIDU_SECRET_KEY '^[A-Za-z0-9]+$'
          check_key JOTSY_BAIDU_APP_DIR '^[^/]+$'
          check_key JOTSY_ALIYUN_CLIENT_ID '^[A-Za-z0-9]+$'
          check_key JOTSY_ALIYUN_CLIENT_SECRET '^[A-Za-z0-9]+$'
          check_pair JOTSY_GOOGLE_CLIENT_ID JOTSY_GOOGLE_CLIENT_SECRET
          check_pair JOTSY_BAIDU_APP_KEY JOTSY_BAIDU_SECRET_KEY

          [[ -n "${JOTSY_GOOGLE_CLIENT_ID:-}${JOTSY_GOOGLE_WEB_CLIENT_ID:-}" ]] ||
            echo "::warning::Google Drive keys are not set; Google Drive is hidden in this build"
          [[ -n "${JOTSY_DROPBOX_APP_KEY:-}" ]] ||
            echo "::warning::Dropbox key is not set; Dropbox is hidden in this build"
          [[ -n "${JOTSY_MICROSOFT_CLIENT_ID:-}" ]] ||
            echo "::warning::OneDrive key is not set; OneDrive is hidden in this build"
          [[ -n "${JOTSY_BAIDU_APP_KEY:-}" ]] ||
            echo "::warning::Baidu Netdisk keys are not set; Baidu Netdisk is hidden in this build"
          [[ -n "${JOTSY_ALIYUN_CLIENT_ID:-}" ]] ||
            echo "::warning::Alipan key is not set; Alipan is hidden in this build"

          # 只写入已配置的值，未配置的沿用代码里的默认值（空即隐藏）。
          python3 - <<'PY'
          import json
          import os

          names = [
              'JOTSY_GOOGLE_CLIENT_ID', 'JOTSY_GOOGLE_CLIENT_SECRET',
              'JOTSY_GOOGLE_WEB_CLIENT_ID', 'JOTSY_DROPBOX_APP_KEY',
              'JOTSY_MICROSOFT_CLIENT_ID', 'JOTSY_MICROSOFT_TENANT',
              'JOTSY_BAIDU_APP_KEY', 'JOTSY_BAIDU_SECRET_KEY', 'JOTSY_BAIDU_APP_DIR',
              'JOTSY_ALIYUN_CLIENT_ID', 'JOTSY_ALIYUN_CLIENT_SECRET',
          ]
          keys = {name: os.environ[name] for name in names if os.environ.get(name)}
          with open('cloud_backup_keys.json', 'w', encoding='utf-8') as file:
              json.dump(keys, file)
          print('Cloud backup keys configured:', ', '.join(sorted(keys)) or 'none')
          PY

      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --dart-define-from-file=cloud_backup_keys.json

      - name: Prepare release artifacts
        id: artifact
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-artifacts/jotsy-${safe_ref}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-artifacts/jotsy-${safe_ref}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-artifacts/jotsy-${safe_ref}-x86_64.apk"
          # 校验和随包一起发布，下载后可用 `sha256sum -c SHA256SUMS.txt` 核对完整性。
          (cd release-artifacts && sha256sum -- *.apk > SHA256SUMS.txt)
          cat release-artifacts/SHA256SUMS.txt
          echo "artifact_name=release-apks-${safe_ref}" >> "$GITHUB_OUTPUT"

      # 应用内更新清单：版本（含构建号）、各 ABI 安装包的大小与 SHA-256、中英文
      # 更新说明。应用经镜像读取 releases/latest/download/jotsy-update.json，一个
      # 小请求拿全信息（国内网络下 api.github.com 常不可用或被限流），见
      # lib/core/services/app_update_checker.dart。Release 正文经环境变量传入，
      # 不直接展开进脚本。
      - name: Write in-app update manifest
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          printf '%s' "$RELEASE_BODY" > "$RUNNER_TEMP/release-body.md"
          dart run tool/write_update_manifest.dart \
            --tag "$GITHUB_REF_NAME" \
            --artifacts release-artifacts \
            --published-at "$PUBLISHED_AT" \
            --notes-fallback "$RUNNER_TEMP/release-body.md" \
            --out release-artifacts/jotsy-update.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
            release-artifacts/jotsy-update.json
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # 清单放在最后：应用读到清单即认为安装包已就绪。
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt
            release-artifacts/jotsy-update.json
          fail_on_unmatched_files: true
          overwrite_files: true
